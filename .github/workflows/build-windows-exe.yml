name: Build BOTROL Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "desktop-agent/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop-agent/requirements.txt pyinstaller

      - name: Build standalone executable
        working-directory: desktop-agent
        run: pyinstaller --noconfirm --clean --onefile --console --name BOTROL-Voice-Agent botrol_hotkey.py

      - name: Publish latest executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-agent-latest
          name: BOTROL Windows Desktop Agent (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: desktop-agent/dist/BOTROL-Voice-Agent.exe
