services:
  - type: web
    name: botrol-cloud
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOTROL_DEVICE_TOKEN
        generateValue: true
      - key: BOTROL_DESKTOP_TOKEN
        generateValue: true
      - key: BOTROL_ADMIN_TOKEN
        generateValue: true
      - key: BOTROL_ALLOWED_ORIGINS
        value: https://botrol-setup.vercel.app
